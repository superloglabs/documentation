<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
<title id="title">How Superlog works</title>
<desc id="desc">Web apps send logs and traces through the browser SDK. Backend services send logs, traces and metrics through OpenTelemetry. Cloud integrations send logs and metrics. Superlog stores telemetry for dashboards, alerts, error issues and agent access. Synthetic checks send requests to web apps and backend services. Alerts, errors and failing checks notify Slack.</desc>
